<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#7cc85a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <title>Choo-Choo Builder</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #7cc85a; overflow: hidden;
      touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #game { width: 100%; height: 100%; position: relative; z-index: 1; }
    #rotate { display: none; position: fixed; inset: 0; background: #7cc85a; align-items: center; justify-content: center; z-index: 10; }
    #rotate svg { width: 40vmin; height: 40vmin; animation: tilt 2s ease-in-out infinite; }
    @keyframes tilt { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
    @media (orientation: portrait) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate" aria-label="Turn the tablet sideways">
    <svg viewBox="0 0 100 100"><rect x="30" y="10" width="40" height="80" rx="8" fill="#fff" stroke="#3b6b2a" stroke-width="5"/><circle cx="50" cy="80" r="4" fill="#3b6b2a"/></svg>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
